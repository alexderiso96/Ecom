name: CJ Inventory & Stock Sync (Zero-Cost Cron)

on:
  schedule:
    # Esegue la sincronizzazione ogni 6 ore (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permette di avviare la sincronizzazione manualmente da GitHub Actions

jobs:
  sync-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Inventory Sync via Next.js Protected API
        run: |
          echo "Avvio sincronizzazione scorte CJdropshipping..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X GET "${{ secrets.APP_URL }}/api/cj/sync/inventory" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          echo "HTTP Status Code: $HTTP_STATUS"
          cat response.json
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Errore durante la sincronizzazione delle scorte!"
            exit 1
          fi

